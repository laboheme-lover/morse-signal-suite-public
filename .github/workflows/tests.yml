name: Repository tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-tests:
    name: Python checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install -r ci/requirements.txt
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run repository checks
        run: python ci/run_tests.py
  web-and-android-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ci/requirements*.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install UI test dependencies
        run: |
          python -m pip install -r ci/requirements-web.txt
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Exercise Web UI logic in isolated app processes
        run: python ci/test_web.py
      - name: Test Android common logic with synthetic inputs
        run: python ci/test_android_core.py
