plugins { id 'com.android.application' }
android {
    namespace 'jp.local.wabun'
    compileSdk 35
    defaultConfig {
        applicationId 'jp.local.wabun'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.5.0'
        testInstrumentationRunner 'jp.local.wabun.DeviceSmokeTest'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
    sourceSets { androidTest { assets.srcDirs = ['../test-data'] } }
}



