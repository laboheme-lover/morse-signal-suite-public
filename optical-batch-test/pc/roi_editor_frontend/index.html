<!doctype html><html lang="ja"><meta charset="utf-8">
<style>body{font:15px sans-serif;margin:0;color:#203344}button,select{font:inherit;padding:7px;margin:4px}#view{overflow:auto;max-height:560px;border:1px solid #aab7c3;background:#111}canvas{display:block;touch-action:none}#status{margin:8px 0}button{cursor:pointer}#apply{background:#087e76;color:white;border:0;border-radius:5px}</style>
<div>緑枠の内側をドラッグして移動、四隅・辺の白い四角をドラッグしてサイズ変更できます。</div>
<div><label>表示倍率 <select id="zoom"><option value="1">全体</option><option value="2">2倍</option><option value="4">4倍</option><option value="8">8倍</option></select></label><button id="new">新しい範囲を描く</button><button id="reset">変更前に戻す</button><button id="apply">この緑枠を解析に適用</button></div>
<div id="view"><canvas id="canvas" aria-label="光源範囲のドラッグ編集"></canvas></div><div id="status" role="status"></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),img=new Image();
let args=null,rect=null,original=null,scale=1,drag=null,drawing=false;
function send(type,extra={}){window.parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function clamp(r){let w=Math.max(2,Math.min(args.width,Math.round(r[2]))),h=Math.max(2,Math.min(args.height,Math.round(r[3])));return [Math.max(0,Math.min(args.width-w,Math.round(r[0]))),Math.max(0,Math.min(args.height-h,Math.round(r[1]))),w,h]}
function handles(){let [x,y,w,h]=rect;return [[x,y,'nw'],[x+w/2,y,'n'],[x+w,y,'ne'],[x+w,y+h/2,'e'],[x+w,y+h,'se'],[x+w/2,y+h,'s'],[x,y+h,'sw'],[x,y+h/2,'w']]}
function paint(){if(!rect||!img.complete)return;ctx.drawImage(img,0,0,canvas.width,canvas.height);let [x,y,w,h]=rect;ctx.strokeStyle='#00ff55';ctx.lineWidth=2;ctx.strokeRect(x*scale,y*scale,w*scale,h*scale);for(let [a,b] of handles()){ctx.fillStyle='white';ctx.fillRect(a*scale-4,b*scale-4,8,8);ctx.strokeStyle='#087e76';ctx.strokeRect(a*scale-4,b*scale-4,8,8)}document.getElementById('status').textContent=`左X ${x} ／ 上Y ${y} ／ 幅 ${w} ／ 高さ ${h} px（元動画座標） — 「適用」で解析範囲を更新`;}
function layout(){if(!args)return;scale=Math.min(1,(document.getElementById('view').clientWidth-2)/args.width)*Number(document.getElementById('zoom').value);canvas.width=Math.round(args.width*scale);canvas.height=Math.round(args.height*scale);paint();height()}
function point(e){let b=canvas.getBoundingClientRect();return [(e.clientX-b.left)/scale,(e.clientY-b.top)/scale]}
function hit(p){for(let [x,y,key] of handles()){if(Math.abs(x-p[0])*scale<9&&Math.abs(y-p[1])*scale<9)return key}let [x,y,w,h]=rect;return p[0]>=x&&p[0]<=x+w&&p[1]>=y&&p[1]<=y+h?'move':null}
canvas.addEventListener('pointerdown',e=>{if(!args)return;let p=point(e),mode=drawing?'new':hit(p);if(!mode)return;drag={mode,p,r:rect.slice()};canvas.setPointerCapture(e.pointerId);e.preventDefault()});
canvas.addEventListener('pointermove',e=>{if(!args)return;let p=point(e);if(!drag){let m=hit(p);canvas.style.cursor=drawing?'crosshair':m==='move'?'move':m?'crosshair':'default';return}let {mode,r}=drag,dx=p[0]-drag.p[0],dy=p[1]-drag.p[1];if(mode==='move')rect=clamp([r[0]+dx,r[1]+dy,r[2],r[3]]);else if(mode==='new')rect=clamp([Math.min(drag.p[0],p[0]),Math.min(drag.p[1],p[1]),Math.abs(dx),Math.abs(dy)]);else{let l=r[0],t=r[1],right=l+r[2],bottom=t+r[3];if(mode.includes('w'))l=Math.max(0,Math.min(right-2,l+dx));if(mode.includes('e'))right=Math.min(args.width,Math.max(l+2,right+dx));if(mode.includes('n'))t=Math.max(0,Math.min(bottom-2,t+dy));if(mode.includes('s'))bottom=Math.min(args.height,Math.max(t+2,bottom+dy));rect=clamp([l,t,right-l,bottom-t])}paint()});
function end(){drag=null;drawing=false;document.getElementById('new').style.background=''}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
document.getElementById('zoom').onchange=layout;
document.getElementById('new').onclick=()=>{drawing=true;document.getElementById('new').style.background='#bcefe7'};
document.getElementById('reset').onclick=()=>{rect=original.slice();end();paint()};
document.getElementById('apply').onclick=()=>{if(!args)return;send('streamlit:setComponentValue',{value:{roi:rect,context:args.context,event:Date.now().toString()+Math.random()},dataType:'json'})};
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data.type!=='streamlit:render')return;args=e.data.args;rect=clamp(args.roi);original=rect.slice();img.onload=layout;img.src=args.image;});
window.addEventListener('resize',layout);send('streamlit:componentReady',{apiVersion:1});height();
</script></html>
